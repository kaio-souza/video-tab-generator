<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablatura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="displayer">
        <img src="./logo.jpeg" class="logo" alt="">
        <div class="tab">
            <div class="notes">
                <p>G</p>
                <p>D</p>
                <p>A</p>
                <p>E</p>
            </div>
            <div class="tab-play">
                <div class="string" id="g">
                </div>
                <div class="string" id="d">
                </div>
                <div class="string" id='a'>
                </div>
                <div class="string" id="e">
                </div>
            </div>
        </div>
    </div>
    <button onclick="play()"> PLAY </button>
    <script src="libs/dom-to-image.js"></script>
    <script src="script.js"></script>
</body>
</html>
